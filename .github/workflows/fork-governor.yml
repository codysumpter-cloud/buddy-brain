name: Govern forks and donors

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/fork-governor.yml'
      - 'scripts/fork-governor.mjs'
      - 'scripts/fork-sync-policy.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-governor
  cancel-in-progress: true

jobs:
  govern-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Verify governor token
        env:
          FORK_GOVERNOR_TOKEN: ${{ secrets.FORK_GOVERNOR_TOKEN }}
        run: |
          if [ -z "${FORK_GOVERNOR_TOKEN}" ]; then
            echo "Missing repository secret FORK_GOVERNOR_TOKEN." >&2
            echo "Grant it contents:write, pull-requests:write, workflows:write, and metadata read on your fork repos." >&2
            exit 1
          fi

      - name: Refresh fork inventory
        env:
          FORK_GOVERNOR_TOKEN: ${{ secrets.FORK_GOVERNOR_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          DONORS_PATH: DONORS.yaml
        run: node scripts/fork-governor.mjs

      - name: Enforce manual conflict-safe fork sync policy
        env:
          FORK_GOVERNOR_TOKEN: ${{ secrets.FORK_GOVERNOR_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: node scripts/fork-sync-policy.mjs

      - name: Open, update, merge, or close DONORS refresh PR
        env:
          GH_TOKEN: ${{ secrets.FORK_GOVERNOR_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: automation/fork-governor-sync
          DONORS_PATH: DONORS.yaml
        run: bash scripts/fork-governor-pr.sh
