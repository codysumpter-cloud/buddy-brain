name: Agent Life cross-repo e2e

on:
  pull_request:
    paths:
      - ".github/workflows/agent-life-cross-repo-e2e.yml"
      - "scripts/agent_life_arena_score.py"
      - "scripts/agent_life_cross_repo_verify.py"
      - "tests/test_agent_life_arena_score.py"
      - "tests/test_agent_life_cross_repo_verify.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUAP_SHA: 87c6504a7b1b1f5b3ab97dca7a419ad0136555eb
  BUDDY_AGENT_SHA: a6624b9104cebd6d114334ec8228f3aae765246e
  KNOWLEDGE_VAULT_SHA: a5bbe97de89f7ffecfd5cc39fb12839bb5a7fa52

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Buddy Brain exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: brain

      - name: Check out merged BUAP commit
        uses: actions/checkout@v7
        with:
          repository: codysumpter-cloud/buddy-universal-agent-profile
          ref: ${{ env.BUAP_SHA }}
          path: buap

      - name: Check out merged Buddy Agent commit
        uses: actions/checkout@v7
        with:
          repository: codysumpter-cloud/buddy-agent
          ref: ${{ env.BUDDY_AGENT_SHA }}
          path: agent

      - name: Check out merged Knowledge Vault commit
        uses: actions/checkout@v7
        with:
          repository: codysumpter-cloud/knowledge-vault
          ref: ${{ env.KNOWLEDGE_VAULT_SHA }}
          path: vault

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Buddy Brain judges
        run: python -m unittest discover -s brain/tests -p 'test_agent_life_*'

      - name: Compile the real BUAP Agent Life profile
        working-directory: buap/packages/buap-compiler
        run: |
          npm test
          npm run build:example
          test -s examples/repository/generated/.buddy/life-profile.json

      - name: Install Buddy Agent host
        run: python -m pip install -e ./agent --quiet

      - name: Run the complete four-repository proof chain
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          ARTIFACTS="$ROOT/artifacts"
          PROFILE="$ROOT/buap/packages/buap-compiler/examples/repository/generated/.buddy/life-profile.json"
          mkdir -p "$ARTIFACTS/outbox"

          buddy-life \
            --profile "$PROFILE" \
            --state "$ARTIFACTS/state.json" \
            --outbox "$ARTIFACTS/outbox" \
            outcome \
            --id agent-life-cross-repo-positive \
            --kind task_succeeded \
            --occurred-at 2026-07-30T16:00:00Z \
            --subject-type tool \
            --subject-id github \
            --reward 1 \
            --confidence 1 \
            --significance 1 \
            --authority-kind verifier \
            --authority-id agent-life-cross-repo-e2e \
            --evidence "github-actions=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$ARTIFACTS/learning-result.json"

          RAW_EVENT="$(find "$ARTIFACTS/outbox" -maxdepth 1 -type f -name 'life-*.json' -print -quit)"
          test -n "$RAW_EVENT"
          test -s "$RAW_EVENT"

          python "$ROOT/vault/99-System/Vegapunk Brain/tools/agent_life_ingest.py" \
            --events "$RAW_EVENT" \
            --out "$ARTIFACTS/canonical-events.jsonl"

          python "$ROOT/vault/99-System/Vegapunk Brain/tools/graph_compiler.py" \
            --events "$ARTIFACTS/canonical-events.jsonl" \
            --out "$ARTIFACTS/graph-records.jsonl"

          buddy-life \
            --profile "$PROFILE" \
            --state "$ARTIFACTS/arena-state.json" \
            --outbox "$ARTIFACTS/arena-outbox" \
            arena \
            --out "$ARTIFACTS/arena-receipt.json" \
            > "$ARTIFACTS/arena-stdout.json"

          python "$ROOT/brain/scripts/agent_life_arena_score.py" \
            "$ARTIFACTS/arena-receipt.json" \
            --out "$ARTIFACTS/score-receipt.json"

          BRAIN_SHA="$(git -C "$ROOT/brain" rev-parse HEAD)"
          python "$ROOT/brain/scripts/agent_life_cross_repo_verify.py" \
            --profile "$PROFILE" \
            --learning-result "$ARTIFACTS/learning-result.json" \
            --raw-event "$RAW_EVENT" \
            --canonical-event "$ARTIFACTS/canonical-events.jsonl" \
            --graph-record "$ARTIFACTS/graph-records.jsonl" \
            --arena-receipt "$ARTIFACTS/arena-receipt.json" \
            --score-receipt "$ARTIFACTS/score-receipt.json" \
            --buap-sha "$BUAP_SHA" \
            --buddy-agent-sha "$BUDDY_AGENT_SHA" \
            --knowledge-vault-sha "$KNOWLEDGE_VAULT_SHA" \
            --buddy-brain-sha "$BRAIN_SHA" \
            --out "$ARTIFACTS/cross-repo-receipt.json"

          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("artifacts/cross-repo-receipt.json").read_text())
          assert receipt["passed"] is True
          assert receipt["checks"]["buddy_brain_independent_score"] == 100
          print(
              "Agent Life cross-repo proof passed:",
              receipt["receipt_sha256"],
              receipt["components"],
          )
          PY

      - name: Upload proof receipts
        uses: actions/upload-artifact@v4
        with:
          name: agent-life-cross-repo-proof
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
